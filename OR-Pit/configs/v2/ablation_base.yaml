# Shared settings for the v2 ablation study (cumulative A→D). Identical data, seed, schedule and
# budget for every variant: 6 epochs × 3000 on-the-fly 2-second mixtures, validated on the same
# 400 fixed 4-second dev-clean mixtures (2–5 speakers, WHAM! noise).
extends: ../gtx1650.yaml
audio:
  segment_sec: 2.0            # 2 s segments train ~4x faster than 4 s (attention is O(T^2))
  min_active_sec: 0.75
data:
  mixtures_per_epoch: 3000
curriculum:
  stages:
    - {until_epoch: 1, num_speakers: [2, 3], overlap: [0.3, 1.0], noise: true, snr_db: [-5.0, 5.0], reverb: false}
    - {until_epoch: null, num_speakers: [2, 3, 4, 5], overlap: [0.3, 1.0], noise: true, snr_db: [-5.0, 5.0], reverb: false}
train:
  epochs: 6
  batch_size: 4
  accumulation_steps: 4       # effective batch 16
  lr: 5.0e-4
  scheduler: warmup_cosine
  warmup_steps: 150
  min_lr_ratio: 0.05
  log_every: 100
  ckpt_every_steps: 50
  num_workers: 3              # data loading (file opens ~90 ms on this PC) was the bottleneck at 2
